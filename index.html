
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08111f">
<title>Radar FC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08111f;color:#f2f6fc;font-family:Arial,sans-serif}
header{max-width:1000px;margin:auto;padding:22px 16px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:23px}
.sub{font-size:11px;color:#91a5bc;margin-top:4px}
button{background:#14263b;color:white;border:1px solid #29415c;border-radius:10px;padding:11px 14px;cursor:pointer}
main{max-width:1000px;margin:auto;padding:0 16px 35px}
.hero{background:linear-gradient(120deg,#123b35,#14263b);border:1px solid #28604f;padding:20px;border-radius:16px;margin-bottom:18px}
.hero h2{margin:0 0 7px;font-size:19px}
.hero p{margin:0;color:#b6c9d9;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
button.active{background:#176344;border-color:#42d392}
.leagues{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}
.leagues button{white-space:nowrap;font-size:12px}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.section h3{font-size:16px;margin:0}
.muted{font-size:12px;color:#91a5bc}
.matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.match{background:#101e30;border:1px solid #263b53;border-radius:15px;padding:15px}
.matchtop{display:flex;justify-content:space-between;color:#91a5bc;font-size:11px;margin-bottom:15px;gap:8px}
.teams{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px;font-weight:bold}
.score{text-align:right;font-size:19px}
.meta{color:#91a5bc;font-size:11px;margin-top:12px;border-top:1px solid #263b53;padding-top:10px}
.phase{margin-top:14px;background:#0b1929;border:1px solid #29415c;border-radius:11px;padding:12px}
.phase h4{margin:0 0 10px;font-size:13px}
.phase-result{color:#65e3a7;font-weight:bold;font-size:13px;margin-bottom:12px}
.history{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.history-team{background:#101e30;border:1px solid #263b53;border-radius:9px;padding:9px;min-width:0}
.history-team strong{font-size:12px;display:block;margin-bottom:8px}
.game-result{font-size:11px;color:#b8c8d8;padding:6px 0;border-top:1px solid #263b53;line-height:1.4}
.win{color:#65e3a7}
.draw{color:#f3d27a}
.loss{color:#ff9292}
.loading,.empty{text-align:center;padding:28px 12px;color:#91a5bc;font-size:13px;line-height:1.5}
footer{text-align:center;color:#74879d;font-size:11px;line-height:1.5;padding:25px 10px}
@media(max-width:520px){header{padding-top:18px}.matches{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
 <div>
  <h1>⚽ RADAR FC</h1>
  <div class="sub">CENTRAL DE INFORMAÇÕES DO FUTEBOL</div>
 </div>
 <button id="refresh">↻ Atualizar</button>
</header>

<main>
 <section class="hero">
  <h2>O futebol em um só lugar.</h2>
  <p>Partidas, placares e fase recente dos clubes.</p>
 </section>

 <div class="toolbar">
  <button class="active" data-day="today">Hoje</button>
  <button data-day="tomorrow">Amanhã</button>
  <button data-day="yesterday">Ontem</button>
 </div>

 <div class="section">
  <h3>Competições</h3>
  <span class="muted">Escolha uma liga</span>
 </div>
 <div class="leagues" id="leagues"></div>

 <div class="section">
  <h3 id="title">Partidas</h3>
  <span class="muted" id="count"></span>
 </div>

 <div class="matches" id="matches">
  <div class="loading">Carregando partidas...</div>
 </div>

 <footer>
  Dados esportivos fornecidos pela ESPN.
  A comparação de fase considera os resultados recentes disponíveis.
 </footer>
</main>

<script>
const competitions=[
 {id:"all",name:"Todas",path:null},
 {id:"bra",name:"Brasileirão",path:"bra.1"},
 {id:"eng",name:"Premier League",path:"eng.1"},
 {id:"esp",name:"La Liga",path:"esp.1"},
 {id:"ita",name:"Serie A",path:"ita.1"},
 {id:"ger",name:"Bundesliga",path:"ger.1"},
 {id:"fra",name:"Ligue 1",path:"fra.1"},
 {id:"ucl",name:"Champions League",path:"uefa.champions"},
 {id:"uel",name:"Europa League",path:"uefa.europa"}
];

let selected="all";
let day="today";
let games=[];
const historyCache=new Map();
const $=s=>document.querySelector(s);

function dateKey(offset){
 const d=new Date();
 d.setDate(d.getDate()+offset);
 return d.getFullYear()+
  String(d.getMonth()+1).padStart(2,"0")+
  String(d.getDate()).padStart(2,"0");
}

function offsetDay(){
 return day==="tomorrow"?1:day==="yesterday"?-1:0;
}

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function getScore(value){
 if(value===null||value===undefined)return NaN;
 const raw=typeof value==="object"
  ?(value.value??value.displayValue)
  :value;
 const n=Number(raw);
 return Number.isFinite(n)?n:NaN;
}

function renderLeagues(){
 $("#leagues").innerHTML=competitions.map(c=>
  `<button class="${selected===c.id?"active":""}" data-league="${c.id}">${c.name}</button>`
 ).join("");

 document.querySelectorAll("[data-league]").forEach(b=>{
  b.onclick=()=>{
   selected=b.dataset.league;
   renderLeagues();
   load();
  };
 });
}

function parseEvent(e,league,path){
 const comp=e.competitions?.[0]||{};
 const teams=comp.competitors||[];
 const home=teams.find(t=>t.homeAway==="home")||teams[0]||{};
 const away=teams.find(t=>t.homeAway==="away")||teams[1]||{};
 const status=comp.status||e.status||{};

 return {
  id:e.id,
  league,
  path,
  home:home.team?.displayName||"Time a definir",
  away:away.team?.displayName||"Time a definir",
  homeId:home.team?.id,
  awayId:away.team?.id,
  hs:home.score?.displayValue??home.score??"-",
  as:away.score?.displayValue??away.score??"-",
  completed:status.type?.completed===true,
  state:status.type?.shortDetail||status.type?.description||"Agendado",
  date:e.date
 };
}

async function load(){
 const box=$("#matches");
 box.innerHTML='<div class="loading">Buscando partidas...</div>';

 const comps=selected==="all"
  ?competitions.filter(c=>c.path)
  :competitions.filter(c=>c.id===selected);

 try{
  const results=await Promise.all(comps.map(async c=>{
   const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${c.path}/scoreboard?dates=${dateKey(offsetDay())}`;
   const response=await fetch(url);
   if(!response.ok)return [];
   const data=await response.json();
   return (data.events||[]).map(e=>parseEvent(e,c.name,c.path));
  }));

  games=results.flat().sort((a,b)=>new Date(a.date)-new Date(b.date));
  renderGames();
 }catch(error){
  box.innerHTML='<div class="empty">Não foi possível carregar os jogos. Tente novamente.</div>';
 }
}

async function teamHistory(path,id){
 const key=path+":"+id;

 if(!historyCache.has(key)){
  historyCache.set(key,(async()=>{
   const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${path}/teams/${id}/schedule`;
   const response=await fetch(url);
   if(!response.ok)throw Error("Histórico indisponível");

   const data=await response.json();

   return (data.events||[]).map(e=>{
    const comp=e.competitions?.[0]||{};
    const teams=comp.competitors||[];
    const me=teams.find(t=>String(t.team?.id)===String(id));
    const other=teams.find(t=>String(t.team?.id)!==String(id));
    const status=comp.status?.type||e.status?.type||{};

    const scored=getScore(me?.score);
    const conceded=getScore(other?.score);

    return {
     id:e.id,
     date:e.date,
     opponent:other?.team?.displayName||"Adversário",
     scored,
     conceded,
     completed:status.completed===true||status.state==="post"
    };
   }).filter(g=>
    g.completed&&
    Number.isFinite(g.scored)&&
    Number.isFinite(g.conceded)
   );
  })());
 }

 const list=await historyCache.get(key);

 return list
  .sort((a,b)=>new Date(b.date)-new Date(a.date))
  .slice(0,5);
}

function getForm(games){
 const wins=games.filter(g=>g.scored>g.conceded).length;
 const draws=games.filter(g=>g.scored===g.conceded).length;
 const losses=games.filter(g=>g.scored<g.conceded).length;

 return {wins,draws,losses,points:wins*3+draws};
}

function resultLabel(g){
 if(g.scored>g.conceded)return ["VITÓRIA","win"];
 if(g.scored===g.conceded)return ["EMPATE","draw"];
 return ["DERROTA","loss"];
}

function renderHistory(team,games){
 const form=getForm(games);

 return `
 <div class="history-team">
  <strong>${safe(team)}</strong>
  <div class="muted">V ${form.wins} · E ${form.draws} · D ${form.losses}</div>
  ${games.map(g=>{
   const [label,css]=resultLabel(g);
   return `<div class="game-result">
    <span class="${css}">${label}</span><br>
    ${safe(g.opponent)}<br>
    ${g.scored} x ${g.conceded}
   </div>`;
  }).join("")}
 </div>`;
}

async function loadForm(g,card){
 const target=card.querySelector(".phase-content");

 if(!g.homeId||!g.awayId){
  target.textContent="Histórico não disponível.";
  return;
 }

 try{
  const [homeGames,awayGames]=await Promise.all([
   teamHistory(g.path,g.homeId),
   teamHistory(g.path,g.awayId)
  ]);

  if(!homeGames.length||!awayGames.length){
   target.textContent="Ainda não há resultados anteriores disponíveis para comparar.";
   return;
  }

  const homeForm=getForm(homeGames);
  const awayForm=getForm(awayGames);

  let message="Os times estão em fase semelhante.";
  if(homeForm.points>awayForm.points)message=`${g.home} tem a melhor fase recente.`;
  if(awayForm.points>homeForm.points)message=`${g.away} tem a melhor fase recente.`;

  target.innerHTML=`
   <div class="phase-result">${safe(message)}</div>
   <div class="history">
    ${renderHistory(g.home,homeGames)}
    ${renderHistory(g.away,awayGames)}
   </div>`;
 }catch(error){
  target.textContent="Não foi possível carregar os resultados anteriores.";
 }
}

function renderGames(){
 const box=$("#matches");

 $("#title").textContent=selected==="all"
  ?"Partidas de todas as competições"
  :competitions.find(c=>c.id===selected)?.name;

 $("#count").textContent=games.length+" jogo(s)";

 if(!games.length){
  box.innerHTML='<div class="empty">Nenhuma partida encontrada nesta data.</div>';
  return;
 }

 box.innerHTML=games.map(g=>`
  <article class="match" data-id="${safe(g.id)}">
   <div class="matchtop">
    <span>${safe(g.league)}</span>
    <span>${safe(g.state)}</span>
   </div>

   <div class="teams">
    <div>${safe(g.home)}</div>
    <div class="score">${safe(g.hs)}</div>
    <div>${safe(g.away)}</div>
    <div class="score">${safe(g.as)}</div>
   </div>

   <div class="meta">
    ${new Date(g.date).toLocaleDateString("pt-BR")} ·
    ${new Date(g.date).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
   </div>

   <div class="phase">
    <h4>FASE RECENTE DOS TIMES</h4>
    <div class="phase-content loading">Consultando últimos resultados...</div>
   </div>
  </article>
 `).join("");

 box.querySelectorAll(".match").forEach(card=>{
  const g=games.find(x=>String(x.id)===card.dataset.id);
  loadForm(g,card);
 });
}

document.querySelectorAll("[data-day]").forEach(b=>{
 b.onclick=()=>{
  day=b.dataset.day;
  document.querySelectorAll("[data-day]").forEach(x=>
   x.classList.toggle("active",x===b)
  );
  load();
 };
});

$("#refresh").onclick=load;
renderLeagues();
load();
</script>
</body>
</html>
