<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Radar FC</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--tx:#f2f6fc;--mu:#91a5bc;--c1:#14263b;--b1:#29415c;--c2:#101e30;--gn:#65e3a7;--rd:#ff9292;--gb:#176344;--gd:#42d392;--lv:#ff737d}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#eef3f8;--tx:#12202f;--mu:#4d6178;--c1:#e3ebf4;--b1:#bccbdb;--c2:#fff;--gn:#0b8a52;--rd:#c62828;--gb:#1b9a63;--gd:#1b9a63;--lv:#d32f3f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{max-width:1000px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}h1 span{color:var(--gn)}h2{margin:0;font-size:16px}
main{max-width:1000px;margin:auto;padding:0 16px 110px}
button{background:var(--c1);color:var(--tx);border:1px solid var(--b1);border-radius:10px;padding:10px 13px;font:inherit;font-size:13px;cursor:pointer;touch-action:manipulation}
button.on{background:var(--gb);border-color:var(--gd);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}.chips button{white-space:nowrap;font-size:12px}
input{flex:1 1 140px;background:var(--c2);border:1px solid var(--b1);color:var(--tx);padding:10px;border-radius:10px;font-size:16px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;color:var(--mu);font-size:12px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.m,.box{background:var(--c2);border:1px solid var(--b1);border-radius:15px;padding:14px}
.m{cursor:pointer}.m.lv{border-color:#b63d4a}
.mt{display:flex;justify-content:space-between;gap:8px;color:var(--mu);font-size:11px;margin-bottom:12px}.mt .on{color:var(--lv);font-weight:700}
.tm{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;font-weight:700;font-size:14px}
.tm b{font-size:19px;text-align:right}.tn{display:flex;align-items:center;gap:8px;min-width:0}.tn img{width:26px;height:26px;object-fit:contain}
.mf{color:var(--mu);font-size:11px;margin-top:10px;border-top:1px solid var(--b1);padding-top:9px}
.tip{margin-top:9px;font-size:12px;line-height:1.6;color:var(--mu)}.tip b{color:var(--gn)}
.g{color:var(--gn)}.r{color:var(--rd)}.mu{color:var(--mu)}
.em{text-align:center;color:var(--mu);padding:30px 10px;font-size:13px;line-height:1.6}
.pt{color:var(--gn);font-size:12px;font-weight:700;margin:0 0 6px}
.sk{background:var(--c1);border:1px solid var(--gd);border-radius:16px;padding:18px;text-align:center;margin-bottom:12px}
.sk .big{font-size:34px;font-weight:800}.sk small{display:block;color:var(--mu);margin-top:6px;font-size:12px}
.rw{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--b1);font-size:12px}.rw:last-child{border:0}
.note{color:var(--mu);font-size:11px;line-height:1.6;margin-top:10px}
.bar{height:10px;background:var(--b1);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--gd)}
.d{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:4px}.d.v{background:#42d392}.d.e{background:#f5c542}.d.x{background:#ff6b6b}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;background:var(--c2);border-top:1px solid var(--b1);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;border:0;background:transparent;color:var(--mu)}nav button.on{background:var(--gb);color:#fff}
#md{position:fixed;inset:0;background:rgba(4,9,16,.9);z-index:20;overflow:auto;padding:16px}
#md[hidden]{display:none}.mdc{max-width:560px;margin:auto;background:var(--bg);border:1px solid var(--b1);border-radius:16px;padding:16px}
.legal{text-align:center;color:var(--mu);font-size:11px;line-height:1.7;margin-top:26px}
.full{width:100%;margin-top:8px}
</style>
</head>
<body>
<header><h1>⚽ RADAR <span>FC</span></h1><button id="rf">↻ Atualizar</button></header>
<main>
 <div class="row" id="days"><button class="on" data-o="0">Hoje</button><button data-o="1">Amanhã</button><button data-o="-1">Ontem</button></div>
 <div id="jf"><div class="chips" id="comps"></div><div class="row"><input id="q" type="search" placeholder="🔍 Buscar time..." autocomplete="off"><button id="lvb">🔴 Só ao vivo</button></div></div>
 <div class="sec"><h2 id="tt">Partidas</h2><span id="cnt"></span></div>
 <div id="list"></div>
 <p class="legal">🔞 Maiores de 18 anos. Informativo, não é casa de apostas. Probabilidades são estimativas pelo histórico, sem garantia de resultado. Jogue com responsabilidade.<br>Dados: ESPN. Seus dados ficam só neste navegador.</p>
</main>
<nav id="nav"><button class="on" data-t="jogos">⚽ Jogos</button><button data-t="top4">🔥 Top 4</button><button data-t="multi">🎯 Múltipla</button></nav>
<div id="md" hidden><div class="mdc"><button id="mdx">✕ Fechar</button><div id="mdb"></div></div></div>
<script>
const $=s=>document.querySelector(s);
const rd=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const COMPS=[["Todas",null],["Brasileirão","bra.1"],["Série B","bra.2"],["Copa do Brasil","bra.copa_do_brazil"],["Libertadores","conmebol.libertadores"],["Sul-Americana","conmebol.sudamericana"],["Premier League","eng.1"],["Championship","eng.2"],["La Liga","esp.1"],["Serie A","ita.1"],["Bundesliga","ger.1"],["Ligue 1","fra.1"],["Liga Portugal","por.1"],["Champions","uefa.champions"],["Europa League","uefa.europa"],["MLS","usa.1"],["Argentina","arg.1"]];
let sel=null,off=0,tab="jogos",games=[],failed=false,onlyLive=false,search="",loadTok=0,lastLoad=0;
let picks=rd("rfPicks",{}),top4=rd("rfTop4",{}),multi=rd("rfMulti",{});
const dkey=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")};
const dOf=v=>{const d=new Date(v);return isNaN(d)?"":d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")};
const fk=k=>k.slice(6)+"/"+k.slice(4,6);
const fdt=v=>{const d=new Date(v);return isNaN(d)?"Horário não informado":d.toLocaleDateString("pt-BR")+" · "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
const sc=v=>{if(v==null)return NaN;const n=Number(typeof v==="object"?(v.value??v.displayValue):v);return Number.isFinite(n)?n:NaN};
(function(){const lim=dkey(-45);[picks,top4,multi].forEach(o=>Object.keys(o).forEach(k=>{const d=o===picks?o[k].dk:k.slice(0,8);if(!d||d<lim)delete o[k]}));sv("rfPicks",picks);sv("rfTop4",top4);sv("rfMulti",multi)})();

/* DADOS ESPN */
function parse(e,league,path){
 const c=e.competitions?.[0]||{},t=c.competitors||[],h=t.find(x=>x.homeAway==="home")||t[0]||{},a=t.find(x=>x.homeAway==="away")||t[1]||{},st=(c.status||e.status||{}).type||{},s=String(st.state||"");
 const done=st.completed===true||s==="post",live=s==="in"&&!done;
 return{id:String(e.id),league,path,home:h.team?.displayName||"Time a definir",away:a.team?.displayName||"Time a definir",hid:h.team?.id,aid:a.team?.id,hl:h.team?.logo||"",al:a.team?.logo||"",hs:h.score?.displayValue??h.score??"-",as:a.score?.displayValue??a.score??"-",live,done,state:done?"Encerrado":live?(st.shortDetail||"AO VIVO"):(st.shortDetail||"Agendado"),date:e.date}
}
async function board(path,name,o){
 const d=dkey(o),n=dkey(o+1),b="https://site.api.espn.com/apis/site/v2/sports/soccer/"+path+"/scoreboard",m=new Map();let ok=0;
 await Promise.all([d,n].map(async x=>{try{const r=await fetch(b+"?dates="+x+"&limit=100");if(!r.ok)return;const j=await r.json();ok++;(j.events||[]).forEach(e=>{if(e.date&&dOf(e.date)===d)m.set(String(e.id),e)})}catch(e){}}));
 return{list:[...m.values()].map(e=>parse(e,name,path)),ok}
}
const hc=new Map();
function hist(path,id){
 const k=path+":"+id;
 if(!hc.has(k))hc.set(k,(async()=>{
  const r=await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/"+path+"/teams/"+id+"/schedule");if(!r.ok)throw 0;
  const j=await r.json();
  return(j.events||[]).map(e=>{const c=e.competitions?.[0]||{},t=c.competitors||[],me=t.find(x=>String(x.team?.id)===String(id)),ot=t.find(x=>String(x.team?.id)!==String(id)),s=c.status?.type||e.status?.type||{};return{d:e.date,home:me?.homeAway==="home",f:sc(me?.score),a:sc(ot?.score),ok:s.completed===true||s.state==="post"}}).filter(x=>x.ok&&Number.isFinite(x.f)&&Number.isFinite(x.a)).sort((x,y)=>new Date(y.d)-new Date(x.d))
 })().catch(e=>{hc.delete(k);throw e}));
 return hc.get(k)
}
const before=(l,g)=>{const t=new Date(g.date).getTime();return l.filter(x=>new Date(x.d).getTime()<t).slice(0,15)};

/* MODELO: retrospecto ponderado + Poisson, puxado 15% para a média da liga; mercados de gols e chance dupla usam a mistura conservadora */
const wf=(l,fn,hv)=>{const c=L=>{let s=0,t=0;L.forEach((x,i)=>{const w=.9**i;t+=w;if(fn(x))s+=w});return t?s/t*100:0},v=l.filter(x=>x.home===hv);return v.length>=4?.6*c(v)+.4*c(l):c(l)};
const wv=(l,fn,hv)=>{const c=L=>{let s=0,t=0;L.forEach((x,i)=>{const w=.9**i;t+=w;s+=w*fn(x)});return t?s/t:0},v=l.filter(x=>x.home===hv);return v.length>=4?.6*c(v)+.4*c(l):c(l)};
const pois=m=>{const a=[Math.exp(-m)];for(let i=1;i<=8;i++)a.push(a[i-1]*m/i);return a};
function calc(h,a){
 if(h.length<5||a.length<5)return null;
 const hw=wf(h,x=>x.f>x.a,true),hd=wf(h,x=>x.f===x.a,true),hl=wf(h,x=>x.f<x.a,true),aw=wf(a,x=>x.f>x.a,false),ad=wf(a,x=>x.f===x.a,false),al=wf(a,x=>x.f<x.a,false);
 const eH=(hw+al)/2,eD=(hd+ad)/2,eA=(aw+hl)/2,both=fn=>(wf(h,fn,true)+wf(a,fn,false))/2;
 const e15=both(x=>x.f+x.a>=2),e35=both(x=>x.f+x.a<=3);
 let lH=(wv(h,x=>x.f,true)+wv(a,x=>x.a,false))/2,lA=(wv(a,x=>x.f,false)+wv(h,x=>x.a,true))/2;
 lH=.75*lH+.25*1.45;lA=.75*lA+.25*1.15;
 const ph=pois(lH),pa=pois(lA);let mw=0,md=0,ml=0,m15=0,m35=0,t=0;
 for(let i=0;i<=8;i++)for(let j=0;j<=8;j++){const p=ph[i]*pa[j];t+=p;if(i>j)mw+=p;else if(i===j)md+=p;else ml+=p;if(i+j>=2)m15+=p;if(i+j<=3)m35+=p}
 const k=100/t;mw*=k;md*=k;ml*=k;m15*=k;m35*=k;
 const mix=(e,p,b)=>.85*(.5*e+.5*p)+.15*b,mc=(e,p,b)=>.85*(.5*(.5*e+.5*p)+.5*Math.min(e,p))+.15*b;
 return{pH:mix(eH,mw,44),pD:mix(eD,md,26),pA:mix(eA,ml,30),d1x:mc(eH+eD,mw+md,70),dx2:mc(eA+eD,ml+md,56),d12:mc(eH+eA,mw+ml,74),o15:mc(e15,m15,77),u35:mc(e35,m35,79),lH,lA}
}
function legs(p){
 const dc=Math.max(p.d1x,p.dx2,p.d12),k=dc===p.d1x?"dc1x":dc===p.dx2?"dcx2":"dc12";
 return[{k,prob:dc},{k:"o15",prob:p.o15},{k:"u35",prob:p.u35}].sort((x,y)=>y.prob-x.prob)
}
const label=(k,h,a)=>({dc1x:h+" ou empate",dcx2:a+" ou empate",dc12:h+" ou "+a,o15:"Mais de 1,5 gols",u35:"Menos de 3,5 gols"})[k]||k;
const evalLeg=(k,h,a)=>({dc1x:h>=a,dcx2:a>=h,dc12:h!==a,o15:h+a>=2,u35:h+a<=3})[k]?"green":"red";

/* PALPITE GRAVADO: 1 por jogo, o mercado mais provável, calculado só com jogos anteriores à partida e nunca alterado */
async function pickOf(g){
 if(picks[g.id])return picks[g.id];
 if(!g.hid||!g.aid||!g.path)return null;
 try{
  const[h,a]=await Promise.all([hist(g.path,g.hid),hist(g.path,g.aid)]),p=calc(before(h,g),before(a,g));if(!p)return null;
  if(picks[g.id])return picks[g.id];
  const c=legs(p)[0];
  picks[g.id]={k:c.k,prob:Math.round(c.prob*10)/10,home:g.home,away:g.away,league:g.league,path:g.path,date:g.date,dk:dOf(g.date),res:"pending"};
  sv("rfPicks",picks);return picks[g.id]
 }catch(e){return null}
}
function applyResult(id,h,a){
 let ch=false;
 const p=picks[id];if(p&&p.res==="pending"){p.res=evalLeg(p.k,h,a);p.score=h+" x "+a;ch=true}
 Object.values(multi).forEach(m=>m.legs.forEach(l=>{if(l.id===id&&l.res==="pending"){l.res=evalLeg(l.k,h,a);l.score=h+" x "+a;ch=true}}));
 return ch
}
function resolveGames(){
 let ch=false;
 games.forEach(g=>{if(!g.done)return;const h=sc(g.hs),a=sc(g.as);if(Number.isFinite(h)&&Number.isFinite(a)&&applyResult(g.id,h,a))ch=true});
 if(ch){sv("rfPicks",picks);sv("rfMulti",multi)}return ch
}
/* confere palpites de dias em que o app não ficou aberto */
let resolving=false;
async function resolvePast(){
 if(resolving)return;resolving=true;let ch=false;
 try{
  const items=[...Object.entries(picks).map(([id,r])=>[id,r,r.res]),...Object.values(multi).flatMap(m=>m.legs.map(l=>[l.id,l,l.res]))],gr={};
  items.forEach(([id,r,res])=>{
   if(res!=="pending"||!r.path||!r.date)return;
   const t=new Date(r.date).getTime();if(!Number.isFinite(t)||Date.now()<t+3*3600000||Date.now()>t+4*86400000)return;
   const y=dOf(r.date),n=dOf(t+86400000),k=r.path+"|"+y+"|"+n;(gr[k]=gr[k]||new Set()).add(String(id))
  });
  for(const k of Object.keys(gr)){
   const[path,y,n]=k.split("|");
   for(const dt of[y,n]){
    try{
     const r=await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/"+path+"/scoreboard?dates="+dt+"&limit=100");if(!r.ok)continue;
     const j=await r.json();
     (j.events||[]).forEach(e=>{const id=String(e.id);if(!gr[k].has(id))return;const p=parse(e,"",path);if(!p.done)return;const h=sc(p.hs),a=sc(p.as);if(Number.isFinite(h)&&Number.isFinite(a)&&applyResult(id,h,a))ch=true})
    }catch(e){}
   }
  }
 }finally{resolving=false}
 if(ch){sv("rfPicks",picks);sv("rfMulti",multi);if(tab!=="jogos")render(true)}
}

/* TOP 4: até 4 jogos do dia com melhor palpite de 80% ou mais. Lista fixa por dia (jogo escolhido não sai). */
const TOP_MIN=80;let t4p=null;
function buildTop4(all){
 if(t4p)return t4p;
 t4p=(async()=>{
  const dk=dkey(off);let ids=(top4[dk]||[]).map(String);
  if(all&&ids.length<4){
   const pool=games.filter(g=>g.hid&&g.aid&&g.path&&!g.done&&!g.live&&!ids.includes(g.id));
   const ev=await Promise.all(pool.map(async g=>{const r=await pickOf(g);return r&&r.prob>=TOP_MIN?{id:g.id,prob:r.prob}:null}));
   const add=ev.filter(Boolean).sort((x,y)=>y.prob-x.prob).slice(0,4-ids.length);
   if(add.length){ids=ids.concat(add.map(x=>x.id));top4[dk]=ids;sv("rfTop4",top4)}
  }
  return ids
 })().finally(()=>{t4p=null});
 return t4p
}
/* SEQUÊNCIA DE DIAS GREEN: dia green = todos os jogos do Top 4 deram green. Um red zera. Dia em aberto não conta nem quebra. */
function dayStatus(k){
 const ids=top4[k]||[];let g=0,r=0;
 ids.forEach(i=>{const p=picks[i];if(!p)return;if(p.res==="green")g++;else if(p.res==="red")r++});
 return r?"red":(ids.length&&g===ids.length)?"green":"pending"
}
function streak(){
 let s=0,best=rd("rfBest",0);
 Object.keys(top4).filter(k=>top4[k].length).sort().forEach(k=>{const st=dayStatus(k);if(st==="green"){s++;if(s>best)best=s}else if(st==="red")s=0});
 sv("rfBest",best);return{s,best}
}

/* MÚLTIPLA CONFIÁVEL: 2 jogos, cada um com 75% ou mais e 8+ jogos de histórico, escolhidos para a odd justa ficar perto de 1,50 */
async function buildMulti(){
 const pool=games.filter(g=>g.hid&&g.aid&&g.path&&!g.done&&!g.live);
 const ev=(await Promise.all(pool.map(async g=>{
  try{const[h,a]=await Promise.all([hist(g.path,g.hid),hist(g.path,g.aid)]),H=before(h,g),A=before(a,g);if(H.length<8||A.length<8)return null;const p=calc(H,A);if(!p)return null;const c=legs(p)[0];return c.prob>=75?{g,c}:null}catch(e){return null}
 }))).filter(Boolean);
 let best=null;
 for(let i=0;i<ev.length;i++)for(let j=i+1;j<ev.length;j++){
  const x=ev[i],y=ev[j],d=Math.abs(10000/(x.c.prob*y.c.prob)-1.5),mn=Math.min(x.c.prob,y.c.prob);
  if(!best||d<best.d-.005||(Math.abs(d-best.d)<=.005&&mn>best.mn))best={d,mn,x,y}
 }
 const mk=({g,c})=>({id:g.id,path:g.path,league:g.league,home:g.home,away:g.away,date:g.date,k:c.k,prob:Math.round(c.prob*10)/10,res:"pending"});
 return best?[mk(best.x),mk(best.y)]:[]
}

/* TELAS */
const em=t=>'<div class="em">'+t+"</div>";
const tn=(l,n)=>'<div class="tn">'+(l?'<img src="'+esc(l)+'" alt="" onerror="this.style.display=\'none\'">':"")+"<span>"+esc(n)+"</span></div>";
function card(g){
 return'<article class="m '+(g.live?"lv":"")+'" data-id="'+esc(g.id)+'"><div class="mt"><span>'+esc(g.league)+'</span><span class="'+(g.live?"on":"")+'">'+esc(g.state)+'</span></div><div class="tm">'+tn(g.hl,g.home)+"<b>"+esc(g.hs)+"</b>"+tn(g.al,g.away)+"<b>"+esc(g.as)+'</b></div><div class="mf">'+esc(fdt(g.date))+'</div><div class="tip"></div></article>'
}
function tipHTML(p){
 const b=p.res==="green"?' <b class="g">✅ acertou</b>':p.res==="red"?' <b class="r">❌ errou</b>':"";
 return"🎯 Tip: <b>"+esc(label(p.k,p.home,p.away))+" · "+Math.round(p.prob)+"%</b>"+b+(p.score?' <span class="mu">('+esc(p.score)+")</span>":"")
}
function tips(box){
 const run=async c=>{
  const g=games.find(x=>x.id===c.dataset.id);if(!g)return;
  const p=await pickOf(g);if(!p||!c.isConnected)return;
  if(g.done&&p.res==="pending"){const h=sc(g.hs),a=sc(g.as);if(Number.isFinite(h)&&Number.isFinite(a)&&applyResult(g.id,h,a)){sv("rfPicks",picks);sv("rfMulti",multi)}}
  c.querySelector(".tip").innerHTML=tipHTML(p)
 };
 const cs=box.querySelectorAll(".m");
 if(!("IntersectionObserver" in window)){cs.forEach(run);return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);run(e.target)}}),{rootMargin:"300px"});
 cs.forEach(c=>io.observe(c))
}
function viewJogos(){
 const q=norm(search.trim()),l=games.filter(g=>(!onlyLive||g.live)&&(!q||norm(g.home).includes(q)||norm(g.away).includes(q)));
 $("#tt").textContent=sel?COMPS.find(c=>c[1]===sel)[0]:"Partidas";$("#cnt").textContent=l.length+" jogo(s)";
 $("#list").innerHTML=!games.length?em(failed?"Não foi possível carregar os jogos. Confira a conexão e toque em Atualizar.":"Nenhuma partida nesta data."):!l.length?em("Nenhum jogo com esse filtro."):'<div class="gr">'+l.map(card).join("")+"</div>";
 tips($("#list"))
}
async function viewTop4(quiet){
 const tok=loadTok;$("#tt").textContent="🔥 Top 4 · melhor palpite 80%+";
 if(!quiet)$("#list").innerHTML=em("Analisando os jogos do dia...");
 let ids=[];try{ids=await buildTop4(true)}catch(e){}
 if(tab!=="top4"||tok!==loadTok)return;
 resolveGames();
 const st=streak(),td=dkey(0),tds=top4[td]&&top4[td].length?dayStatus(td):null;
 const hoje=tds===null?"sem Top 4 hoje":tds==="green"?"✅ hoje deu green":tds==="red"?"❌ hoje deu red, sequência zerada":"⏳ hoje em aberto";
 const found=ids.map(i=>games.find(g=>g.id===i)).filter(Boolean).sort((a,b)=>(picks[b.id]?.prob||0)-(picks[a.id]?.prob||0));
 $("#cnt").textContent=found.length+" de 4";
 const days=Object.keys(top4).filter(k=>top4[k].length).sort().reverse().slice(0,10).map(k=>{const s=dayStatus(k);return'<div class="rw"><span>'+fk(k)+" · "+top4[k].length+' jogo(s)</span><span class="'+(s==="green"?"g":s==="red"?"r":"mu")+'">'+(s==="green"?"✅ GREEN":s==="red"?"❌ RED":"⏳ em aberto")+"</span></div>"}).join("");
 $("#list").innerHTML='<div class="sk"><div class="big">🔥 '+st.s+'</div>dia'+(st.s===1?"":"s")+" green seguido"+(st.s===1?"":"s")+"<small>"+hoje+" · recorde: "+st.best+" dia(s)</small></div>"+
  (found.length?'<div class="gr">'+found.map(g=>'<div><div class="pt">🎯 '+esc(picks[g.id]?label(picks[g.id].k,g.home,g.away)+" · "+Math.round(picks[g.id].prob)+"%":"Melhor palpite")+"</div>"+card(g)+"</div>").join("")+"</div>":em("Nenhum jogo com palpite de "+TOP_MIN+"% ou mais nesta data."))+
  '<div class="sec"><h2>Histórico do Top 4</h2></div><div class="box">'+(days||em("Ainda não há dias gravados."))+'</div><div class="note">Dia green: todos os jogos do Top 4 do dia deram green, e a sequência soma 1. Um red zera e recomeça. Dia em aberto não conta nem quebra a sequência. A lista é fixa por dia e só é montada com a competição "Todas" aberta, então abra o app nessa aba ao menos uma vez por dia. O histórico guarda 45 dias.</div>';
 tips($("#list"))
}
function mText(m,k){
 const comb=m.legs.reduce((x,l)=>x*l.prob/100,1),lines=["🎯 MÚLTIPLA CONFIÁVEL · "+fk(k),""];
 m.legs.forEach((l,i)=>lines.push((i+1)+") "+l.home+" x "+l.away+"\n   ➜ "+label(l.k,l.home,l.away)+" ("+Math.round(l.prob)+"%)"));
 lines.push("","Probabilidade combinada: "+(comb*100).toFixed(0)+"%","Odd justa: "+(1/comb).toFixed(2).replace(".",","),"","Estimativa pelo histórico. Sem garantia de resultado.");
 return lines.join("\n")
}
function mStatus(m){return m.legs.some(l=>l.res==="red")?"red":m.legs.length&&m.legs.every(l=>l.res==="green")?"green":"pending"}
const TAG={green:'<span class="g">✅ GREEN</span>',red:'<span class="r">❌ RED</span>',pending:'<span class="mu">⏳ Em aberto</span>'};
function viewMulti(){
 $("#tt").textContent="🎯 Múltipla confiável";$("#cnt").textContent=fk(dkey(off));
 const k=dkey(off),m=multi[k];
 let h='<div class="box"><div class="note" style="margin:0 0 10px">2 jogos com 75% ou mais cada, times com 8+ jogos de histórico, escolhidos para a odd justa ficar perto de 1,50.</div><button class="full on" id="gen">✅ Gerar múltipla confiável</button><div class="note" id="gmsg"></div></div>';
 if(m){
  const comb=m.legs.reduce((x,l)=>x*l.prob/100,1);
  h+='<div class="box" style="margin-top:12px"><h2>Múltipla '+TAG[mStatus(m)]+'</h2><div class="rw"><span>Probabilidade combinada</span><b class="g">'+(comb*100).toFixed(0)+'%</b></div><div class="rw"><span>Odd justa</span><b>'+(1/comb).toFixed(2).replace(".",",")+"</b></div>"+
   m.legs.map(l=>'<div class="rw"><div><b>'+esc(l.home)+" x "+esc(l.away)+'</b><br><span class="mu">'+esc(l.league)+" · "+esc(fdt(l.date))+"</span><br>🎯 "+esc(label(l.k,l.home,l.away))+" · <b>"+Math.round(l.prob)+"%</b>"+(l.score?" · placar "+esc(l.score):"")+"</div><div>"+TAG[l.res]+"</div></div>").join("")+
   '<button class="full" id="cp">📋 Copiar múltipla</button></div>'
 }
 const ks=Object.keys(multi).filter(x=>multi[x].legs.length).sort().reverse().slice(0,10),sts=ks.map(x=>mStatus(multi[x])),g=sts.filter(s=>s==="green").length,r=sts.filter(s=>s==="red").length;
 h+='<div class="sec"><h2>Histórico</h2><span>'+(g+r?Math.round(g/(g+r)*100)+"% de green ("+g+" de "+(g+r)+")":"sem resultados")+'</span></div><div class="box">'+(ks.length?ks.map((x,i)=>'<div class="rw"><span>'+fk(x.slice(0,8))+" · "+multi[x].legs.map(l=>Math.round(l.prob)+"%").join(" + ")+"</span><span>"+TAG[sts[i]]+"</span></div>").join(""):em("Nenhuma múltipla gerada ainda."))+'</div><div class="note">Estimativas pelo histórico dos times. Quanto mais jogos, menor a chance de acertar todos. Uma única perda derruba a múltipla. Sem garantia de resultado.</div>';
 $("#list").innerHTML=h;
 const cp=$("#cp");if(cp)cp.onclick=()=>{const t=mText(m,k);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>cp.textContent="✅ Copiado").catch(()=>{cp.textContent="Não foi possível copiar"})};
 $("#gen").onclick=async()=>{
  const msg=$("#gmsg");
  if(m&&m.legs.some(l=>l.res!=="pending")){msg.textContent="Esta múltipla já tem jogos encerrados e não pode ser substituída.";return}
  msg.textContent="Analisando os jogos e o histórico dos times...";
  try{
   const lg=await buildMulti();
   if(lg.length<2){msg.textContent="Poucos jogos com 75% ou mais e histórico completo nesta data. Tente outra data.";return}
   multi[k]={legs:lg,created:Date.now()};sv("rfMulti",multi);if(tab==="multi")viewMulti()
  }catch(e){msg.textContent="Não foi possível gerar agora. Tente novamente."}
 }
}
function render(quiet){
 resolveGames();
 if(tab==="jogos")viewJogos();else if(tab==="top4")viewTop4(quiet);else viewMulti()
}

/* DETALHE DO JOGO */
async function openMatch(g){
 const md=$("#md");md.hidden=false;
 const head='<div class="em" style="padding:14px 0 6px"><b style="font-size:16px;color:var(--tx)">'+esc(g.home)+" "+esc(g.hs)+" x "+esc(g.as)+" "+esc(g.away)+"</b><br>"+esc(g.league)+" · "+esc(g.state)+"<br>"+esc(fdt(g.date))+"</div>";
 $("#mdb").innerHTML=head+em("Carregando análise...");
 try{
  const[h,a]=await Promise.all([hist(g.path,g.hid),hist(g.path,g.aid)]),H=before(h,g),A=before(a,g),p=calc(H,A);
  if(md.hidden)return;
  if(!p){$("#mdb").innerHTML=head+em("Poucos jogos de histórico para calcular as probabilidades.");return}
  const row=(n,v)=>'<div>'+n+" <b>"+Math.round(v)+'%</b></div><div class="bar"><i style="width:'+Math.min(100,v)+'%"></i></div>';
  const form=(n,L)=>'<div class="rw" style="display:block"><b>'+esc(n)+'</b><br>'+L.slice(0,10).map(x=>'<i class="d '+(x.f>x.a?"v":x.f===x.a?"e":"x")+'" title="'+x.f+"x"+x.a+'"></i>').join("")+'<div class="mu">'+L.slice(0,5).map(x=>x.f+"x"+x.a+(x.home?" (casa)":" (fora)")).join(" · ")+"</div></div>";
  const pk=legs(p)[0];
  $("#mdb").innerHTML=head+'<div class="sk"><div class="pt">🎯 Melhor palpite</div><b>'+esc(label(pk.k,g.home,g.away))+'</b><div class="big g">'+Math.round(pk.prob)+"%</div></div>"+
   '<div class="box"><h2>Resultado final (1X2)</h2><br>'+row(esc(g.home),p.pH)+row("Empate",p.pD)+row(esc(g.away),p.pA)+"<h2>Chance dupla e gols</h2><br>"+row("Casa ou empate",p.d1x)+row("Fora ou empate",p.dx2)+row("Sem empate",p.d12)+row("Mais de 1,5 gols",p.o15)+row("Menos de 3,5 gols",p.u35)+
   '<div class="note">Gols esperados: '+esc(g.home)+" "+p.lH.toFixed(2).replace(".",",")+" · "+esc(g.away)+" "+p.lA.toFixed(2).replace(".",",")+'</div></div><div class="sec"><h2>Forma recente</h2></div><div class="box">'+form(g.home,H)+form(g.away,A)+'</div><div class="note">Estimativa por até 15 jogos de cada time, com peso maior nos mais recentes e no mando (casa/fora). Não considera escalações nem lesões. Sem garantia de resultado.</div>'
 }catch(e){$("#mdb").innerHTML=head+em("Análise indisponível agora.")}
}
$("#mdx").onclick=()=>{$("#md").hidden=true};
$("#md").onclick=e=>{if(e.target.id==="md")$("#md").hidden=true};
$("#list").addEventListener("click",e=>{const c=e.target.closest(".m");if(!c)return;const g=games.find(x=>x.id===c.dataset.id);if(g)openMatch(g)});

/* CARREGAR */
async function load(quiet){
 const tok=++loadTok;lastLoad=Date.now();
 if(!quiet)$("#list").innerHTML=em("Buscando partidas...");
 const comps=tab==="jogos"&&sel?COMPS.filter(c=>c[1]===sel):COMPS.filter(c=>c[1]);
 const rs=await Promise.all(comps.map(c=>board(c[1],c[0],off).catch(()=>({list:[],ok:0}))));
 if(tok!==loadTok)return;
 const all=rs.flatMap(r=>r.list);
 if(!all.length&&quiet&&games.length)return;
 games=all.sort((a,b)=>a.live===b.live?new Date(a.date)-new Date(b.date):a.live?-1:1);
 failed=rs.every(r=>!r.ok);
 render(quiet);
 if(tab!=="top4"&&(tab!=="jogos"||!sel))buildTop4(true).catch(()=>{})
}
function chips(){$("#comps").innerHTML=COMPS.map(c=>'<button class="'+(sel===c[1]?"on":"")+'" data-p="'+(c[1]||"")+'">'+esc(c[0])+"</button>").join("")}
$("#comps").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;sel=b.dataset.p||null;chips();games=[];load()};
$("#days").onclick=e=>{const b=e.target.closest("[data-o]");if(!b)return;off=Number(b.dataset.o);document.querySelectorAll("#days button").forEach(x=>x.classList.toggle("on",x===b));games=[];load()};
$("#nav").onclick=e=>{const b=e.target.closest("[data-t]");if(!b||b.dataset.t===tab)return;tab=b.dataset.t;document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));$("#jf").style.display=tab==="jogos"?"block":"none";games=[];load();scrollTo(0,0)};
$("#q").oninput=e=>{search=e.target.value;if(tab==="jogos"&&games.length)viewJogos()};
$("#lvb").onclick=()=>{onlyLive=!onlyLive;$("#lvb").classList.toggle("on",onlyLive);if(tab==="jogos"&&games.length)viewJogos()};
$("#rf").onclick=()=>{games=[];load()};
setInterval(()=>{if(document.hidden)return;const ms=games.some(g=>g.live)?30000:120000;if(Date.now()-lastLoad>=ms-500)load(true)},10000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-lastLoad>30000)load(true)});
chips();load();
setTimeout(resolvePast,4000);setInterval(resolvePast,600000);
</script>
</body>
</html>
